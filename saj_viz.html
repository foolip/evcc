<!DOCTYPE html>
<html>
<head>
    <title>SAJ Modbus Visualizer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
        #controls { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chart { height: 700px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select { width: 100%; height: 200px; font-family: monospace; }
        .hint { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="controls">
        <h2>SAJ Modbus Visualizer</h2>
        <p>1. Load your <code>saj_modbus_log.csv</code> file:</p>
        <input type="file" id="fileInput" accept=".csv">
        <p>2. Select registers to visualize <span class="hint">(Hold Ctrl/Cmd to select multiple)</span>:</p>
        <select id="regSelect" multiple></select>
    </div>
    <div id="chart"></div>

    <script>
        let csvData = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    csvData = results.data;
                    populateSelector(results.meta.fields);
                }
            });
        });

        function populateSelector(fields) {
            const select = document.getElementById('regSelect');
            select.innerHTML = '';
            fields.forEach(f => {
                if (f === 'timestamp') return;
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                select.appendChild(opt);
            });
        }

        document.getElementById('regSelect').addEventListener('change', updateChart);

        function updateChart() {
            if (!csvData) return;
            const selected = Array.from(document.getElementById('regSelect').selectedOptions).map(o => o.value);
            const times = csvData.map(row => row.timestamp);
            
            const traces = selected.map(reg => ({
                x: times,
                y: csvData.map(row => row[reg]),
                name: reg,
                type: 'scatter',
                mode: 'lines+markers'
            }));

            const layout = {
                title: 'Register Values Over Time',
                xaxis: { title: 'Time' },
                yaxis: { title: 'Raw Value' },
                hovermode: 'closest'
            };

            Plotly.newPlot('chart', traces, layout);
        }
    </script>
</body>
</html>
