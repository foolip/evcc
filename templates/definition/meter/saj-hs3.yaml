template: saj-hs3
products:
  - brand: SAJ
    description:
      generic: HS3 Series Three-Phase All-In-One Energy Storage System
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 115200
    comset: 8N1
  - preset: battery-params
  # battery control
  - name: defaultmode
    usages: ["battery"]
    default: 2
    advanced: true
render: |
  type: custom
  # The register addresses were determined through a combination of studying
  # https://github.com/stanus74/home-assistant-saj-h2-modbus/blob/main/custom_components/saj_h2_modbus/modbus_readers.py
  # and independent empirical testing of which registers change in response to changes in solar
  # production, etc. Where the registers match home-assistant-saj-h2-modbus it is followed by a
  # comment giving the name in its modbus_readers.py, and in other cases the testing done is
  # explained in a comment.
  {{- if eq .usage "grid" }}
  power:
    source: calc
    expr: p1 + p2 + p3
    args:
    - name: p1
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4090 # ROnGridOutPowerWatt
        type: holding
        decode: uint16
    - name: p2
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4092 # SOnGridOutPowerWatt
        type: holding
        decode: uint16
    - name: p3
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4094 # TOnGridOutPowerWatt
        type: holding
        decode: uint16
  currents:
  - source: calc
    expr: p / v
    args:
    - name: p
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4090 # ROnGridOutPowerWatt
        type: holding
        decode: uint16
    - name: v
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x408D # ROnGridOutVolt
        type: holding
        decode: uint16
      scale: 0.1
  - source: calc
    expr: p / v
    args:
    - name: p
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4092 # SOnGridOutPowerWatt
        type: holding
        decode: uint16
    - name: v
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4091 # SOnGridOutVolt
        type: holding
        decode: uint16
      scale: 0.1
  - source: calc
    expr: p / v
    args:
    - name: p
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4094 # TOnGridOutPowerWatt
        type: holding
        decode: uint16
    - name: v
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4093 # TOnGridOutVolt
        type: holding
        decode: uint16
      scale: 0.1
  # FIXME: 0x40FD is 0 on HS3
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40FD # feedin_total_energy
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  # FIXME: 0x40A5 and 0x40A3 are zero on HS3
  power:
    source: calc
    expr: mppt + ac_coupled
    args:
    - name: mppt
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x40A5 # pvPower
        type: holding
        decode: int16
    - name: ac_coupled
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x40A3 # CT_PVPowerWatt
        type: holding
        decode: int16
  # FIXME: 0x40C5 is 0 on HS3
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40C5 # totalenergy
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40A6 # batteryPower
      type: holding
      decode: int16
  # FIXME: 0x40D5 is 0 on HS3
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40D5 # bat_total_discharge
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x406F # batEnergyPercent
      type: holding
      decode: uint16
    scale: 0.01
  batterymode:
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: sequence
        set:
        - source: const
          value: {{ .defaultmode }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13895 # AppMode
              type: writeholding
              decode: int16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13905 # BatSocLimitkeep
              type: writeholding
              decode: int16
    - case: 2 # hold
      set:
        source: sequence
        set:
        - source: const
          value: {{ .defaultmode }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13895 # AppMode
              type: writeholding
              decode: int16
        - source: const
          value: {{ .maxsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13905 # BatSocLimitkeep
              type: writeholding
              decode: int16
    - case: 3 # charge
      set:
        source: sequence
        set:
        - source: const
          value: 1 # time_mode
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13895 # AppMode
              type: writeholding
              decode: int16
        - source: const
          value: 1 # enable
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13828 # charge_time_enable
              type: writeholding
              decode: int16
        - source: const
          value: 0 # start (00:00)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13830 # charge_start_time
              type: writeholding
              decode: int16
        - source: const
          value: 0x173B # end (23:59)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13831 # charge_end_time
              type: writeholding
              decode: int16
        - source: const
          value: 0x7F64 # end (0xFF / 100%)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13832 # charge_power_raw
              type: writeholding
              decode: int16
  {{- include "battery-params" . }}
  {{- end }}
