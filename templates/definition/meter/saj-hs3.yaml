template: saj-hs3
products:
  - brand: SAJ
    description:
      generic: HS3 Series Three-Phase All-In-One Energy Storage System
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 115200
    comset: 8N1
  - preset: battery-params
  # battery control
  - name: defaultmode
    usages: ["battery"]
    default: 2
    advanced: true
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA038 # also in 0x40AD+0x40B6 as low+high words.
      type: holding
      decode: int32
  powers:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA03F # TODO: high word in 0xA066
      type: holding
      decode: int16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA045 # TODO: high word in 0xA067
      type: holding
      decode: int16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA04B # TODO: high word in 0xA068
      type: holding
      decode: int16
    scale: 0.1
  currents:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA03E
      type: holding
      decode: int16
    scale: 0.01
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA044
      type: holding
      decode: int16
    scale: 0.01
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA04A
      type: holding
      decode: int16
    scale: 0.01
  voltages:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA03D
      type: holding
      decode: uint16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA043
      type: holding
      decode: uint16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA049
      type: holding
      decode: uint16
    scale: 0.1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x426B
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA04F # also in 0x40A5+0x40B4 as low+high words.
      type: holding
      decode: int32
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x427B # also at 0x421B as a slightly larger value.
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40A6 # also in 0x51B6 as int32
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40D5
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x406F # also in 0x51B8
      type: holding
      decode: uint16
    scale: 0.01
  {{- include "battery-params" . }}
  {{- end }}
