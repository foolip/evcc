template: saj-hs3
products:
  - brand: SAJ
    description:
      generic: HS3 Series Three-Phase All-In-One Energy Storage System
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 115200
    comset: 8N1
  - preset: battery-params
  # battery control
  - name: defaultmode
    usages: ["battery"]
    default: 2
    advanced: true
render: |
  type: custom
  # Diagnostic findings for SAJ H2:
  # 1. SOC: The previous register 0xA00C returned 0. Correct SOC is at 0x406F (wire address).
  # 2. Grid Power & Currents Layout: The Smart Meter block starting at 0x408D (wire address)
  #    is interleaved: V1 (0x408D), I1 (0x408E), F1 (0x408F), P1 (0x4090), V2 (0x4091), P2 (0x4092),
  #    V3 (0x4093), P3 (0x4094).
  # 3. Calculation Choice: Since direct currents (I) are missing for Phase 2 & 3 in this block,
  #    all phase currents are derived via (Power / Voltage). This ensures mathematical
  #    consistency (A * V = W) across all phases for load management.
  # 4. Grid Power: Register 0x40AC only shows inverter residual power. Real house grid power
  #    is the sum of phase powers (P1+P2+P3).
  # 5. Addressing: Offsets confirmed via 0-based wire addresses (matching mbpoll -r [addr+1]).
  {{- if eq .usage "grid" }}
  power:
    source: calc
    expr: p1 + p2 + p3
    args:
    - name: p1
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4090 # RGridPower
        type: holding
        decode: int16
    - name: p2
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4092 # SGridPower
        type: holding
        decode: int16
    - name: p3
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4094 # TGridPower
        type: holding
        decode: int16
  currents:
  - source: calc
    expr: p / v
    args:
    - name: p
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4090 # RGridPower
        type: holding
        decode: int16
    - name: v
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x408D # RGridVolt
        type: holding
        decode: uint16
      scale: 0.1
  - source: calc
    expr: p / v
    args:
    - name: p
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4092 # SGridPower
        type: holding
        decode: int16
    - name: v
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4091 # SGridVolt
        type: holding
        decode: uint16
      scale: 0.1
  - source: calc
    expr: p / v
    args:
    - name: p
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4094 # TGridPower
        type: holding
        decode: int16
    - name: v
      source: modbus
      {{- include "modbus" . | indent 6 }}
      register:
        address: 0x4093 # TGridVolt
        type: holding
        decode: uint16
      scale: 0.1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40FD # Total_FeedInEnergy
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40A4 # TotalPVPower
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40C5 # Total_PVEnergy
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40A6 # TotalBatteryPower
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40D5 # Total_BatDisEnergy
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x406F # BatEnergyPercent
      type: holding
      decode: uint16
    scale: 0.01
  batterymode:
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: sequence
        set:
        - source: const
          value: {{ .defaultmode }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13895 # AppMode
              type: writeholding
              decode: int16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13905 # BatSocLimitkeep
              type: writeholding
              decode: int16
    - case: 2 # hold
      set:
        source: sequence
        set:
        - source: const
          value: {{ .defaultmode }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13895 # AppMode
              type: writeholding
              decode: int16
        - source: const
          value: {{ .maxsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13905 # BatSocLimitkeep
              type: writeholding
              decode: int16
    - case: 3 # charge
      set:
        source: sequence
        set:
        - source: const
          value: 1 # time_mode
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13895 # AppMode
              type: writeholding
              decode: int16
        - source: const
          value: 1 # enable
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13828 # Charge_time_enable_control
              type: writeholding
              decode: int16
        - source: const
          value: 0 # start (00:00)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13830 # First_charge_start_time
              type: writeholding
              decode: int16
        - source: const
          value: 0x173B # end (23:59)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13831 # First_charge_end_time
              type: writeholding
              decode: int16
        - source: const
          value: 0x7F64 # end (0xFF / 100%)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13832 # First_charge_power_time
              type: writeholding
              decode: int16
  {{- include "battery-params" . }}
  {{- end }}
